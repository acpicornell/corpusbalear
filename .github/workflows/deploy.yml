name: Deploy

# Deploy the portal to Cloudflare Workers on push to main.
# Inert until a CLOUDFLARE_API_TOKEN repository secret is set: the guard step
# skips the deploy (keeping the run green) so this workflow can be committed
# before the token exists. Add the secret to activate it.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check for Cloudflare token
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "No CLOUDFLARE_API_TOKEN secret set yet — skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.guard.outputs.skip != 'true'
      - name: Check the site against its own security policy
        if: steps.guard.outputs.skip != 'true'
        # Fails the deploy if a page loads or runs anything the site's _headers does
        # not admit, or links to a page or anchor that does not exist.
        run: python3 scripts/check_site.py web
      - name: Deploy to Cloudflare Workers
        if: steps.guard.outputs.skip != 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Static-assets-only Workers (no `main` entry-point) need Wrangler v4.
          wranglerVersion: "4.112.0"
