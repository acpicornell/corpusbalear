name: Links

# Check that external links stay alive (NGIB, Wikidata, licences, GitHub).
# The corpusbalear.org apex/subdomains are excluded until they are deployed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --max-retries 3 --timeout 30
            --accept '200..=299,429'
            --exclude 'corpusbalear\.org'
            --exclude 'gnu\.org'
            --exclude 'creativecommons\.org'
            README.md docs/*.md web/index.html
          fail: true
